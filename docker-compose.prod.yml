services:
  redis:
    image: redis:alpine
    container_name: lineup-redis-prod
    command: redis-server --appendonly yes
    volumes:
      - redis_data_prod:/data
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-central-1
        awslogs-group: /festival-planner/prod
        awslogs-stream: redis
        awslogs-create-group: "true"

  backend:
    image: ghcr.io/barry4747/festival_planner-backend:${IMAGE_TAG:-latest}
    container_name: lineup-backend-prod
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - FRONTEND_URL=${FRONTEND_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - TICKETMASTER_API_KEY=${TICKETMASTER_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    depends_on:
      - redis
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-central-1
        awslogs-group: /festival-planner/prod
        awslogs-stream: backend
        awslogs-create-group: "true"

  frontend:
    image: ghcr.io/barry4747/festival_planner-frontend:${IMAGE_TAG:-latest}
    container_name: lineup-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt/live/${DOMAIN}/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/${DOMAIN}/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-${SUPABASE_URL}}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-${SUPABASE_KEY}}
    depends_on:
      - backend
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-central-1
        awslogs-group: /festival-planner/prod
        awslogs-stream: frontend
        awslogs-create-group: "true"

volumes:
  redis_data_prod:
