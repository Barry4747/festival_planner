name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  backend-tests:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python (3.12 - matching Dockerfile)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          uv sync --frozen

      - name: Run Pytest Suite (Unit & Integration)
        env:
          ENVIRONMENT: testing
          FRONTEND_URL: http://localhost:5173
          SUPABASE_URL: http://localhost:54321
          SUPABASE_KEY: dummy_anon_key
          SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_key
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          TICKETMASTER_API_KEY: dummy_tm_key
          OPENWEATHER_API_KEY: dummy_weather_key
          GOOGLE_MAPS_API_KEY: dummy_maps_key
          GEMINI_API_KEY: dummy_gemini_key
          PYTHONPATH: .
        run: |
          uv run pytest tests/ -v

      # --- Instrukcja uruchomienia lokalnej instancji Supabase dla testów RLS w CI ---
      # Gdy w repo zostanie dodana konfiguracja CLI (katalog `supabase/` z `config.toml` oraz migracje SQL),
      # odkomentuj poniższe kroki, aby testować polisy RLS w odizolowanym kontenerze Supabase:
      #
      # - name: Setup Supabase CLI
      #   uses: supabase/setup-cli@v1
      #   with:
      #     version: latest
      #
      # - name: Start Local Supabase Stack
      #   run: supabase start
      #
      # - name: Run Supabase RLS Integration Tests
      #   env:
      #     SUPABASE_URL: http://127.0.0.1:54321
      #     SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      #     SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      #   run: |
      #     uv run pytest tests/integration/rls/ -v

  frontend-checks:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (v20 - matching Dockerfile)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Run Typecheck & Build (tsc & vite)
        run: npm run build
