<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="400" height="400" fill="none">
  <!-- Definicja płynnego przejścia kolorów -->
  <defs>
    <linearGradient id="routeGrad" x1="14" y1="12" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#10b981" />
    </linearGradient>
  </defs>
  
  <!-- Linia trasy z nałożonym szmaragdowym gradientem -->
  <path d="M14 12V24C14 26.2091 15.7909 28 18 28H28" stroke="url(#routeGrad)" stroke-width="3.5" stroke-linecap="round" />
  
